<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K3 余量</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "SF Pro Text", sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #e6f4fb 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 110%, #d9f0ee 0%, transparent 55%),
      #edf3f7;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 392px;
    background: linear-gradient(160deg, #ffffff 0%, #f2fbfc 55%, #e7f6f8 100%);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 24px;
    box-shadow:
      0 24px 60px -18px rgba(30, 80, 120, .28),
      0 2px 8px rgba(30, 80, 120, .08),
      inset 0 1px 0 rgba(255,255,255,.95);
    padding: 22px 24px 18px;
    position: relative;
    overflow: hidden;
  }
  .card::before { /* 顶部高光 */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 90px;
    background: linear-gradient(180deg, rgba(255,255,255,.75), transparent);
    pointer-events: none;
  }

  /* ── 头部 ── */
  .head { display: flex; align-items: center; gap: 12px; position: relative; }
  .logo {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: conic-gradient(from 210deg, #14b8a6, #3b82f6, #8b5cf6, #14b8a6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 17px; letter-spacing: .5px;
    box-shadow: 0 6px 14px -4px rgba(59,130,246,.5), inset 0 2px 4px rgba(255,255,255,.45);
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .titles { flex: 1; min-width: 0; }
  .titles h1 { font-size: 19px; font-weight: 700; color: #12242e; letter-spacing: .3px; }
  .titles p { font-size: 12px; color: #7d8f9a; margin-top: 2px; }
  .live {
    display: flex; align-items: center; gap: 5px;
    background: rgba(236,253,245,.9); border: 1px solid rgba(52,211,153,.45);
    color: #059669; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
  }
  .live .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #10b981;
    box-shadow: 0 0 0 0 rgba(16,185,129,.5); animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.45); }
    70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  /* ── 主体 ── */
  .body { display: flex; align-items: center; gap: 20px; margin-top: 20px; }
  .ring-wrap { position: relative; width: 138px; height: 138px; flex: none; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring-center .pct {
    font-size: 34px; font-weight: 800; color: #0f2733; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .ring-center .pct small { font-size: 18px; font-weight: 700; }
  .ring-center .sub { font-size: 12px; color: #8496a1; margin-top: 5px; }

  .fields { flex: 1; display: flex; flex-direction: column; gap: 13px; min-width: 0; }
  .field .k { font-size: 11.5px; color: #8b9aa5; margin-bottom: 2px; }
  .field .v { font-size: 16.5px; font-weight: 700; color: #16283a; letter-spacing: .2px; }
  .field .v em { font-style: normal; font-size: 11px; color: #94a3ad; font-weight: 500; margin-left: 4px; }

  /* ── 底部 ── */
  .bar-track {
    margin-top: 22px; height: 9px; border-radius: 999px;
    background: #e3ebef; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(20,50,70,.08);
  }
  .bar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #2dd4bf, #3b82f6);
    box-shadow: 0 0 8px rgba(45,212,191,.55);
    transition: width .8s cubic-bezier(.22,1,.36,1);
  }
  .meta { display: flex; justify-content: space-between; margin-top: 9px;
    font-size: 11.5px; color: #8b9aa5; }
  .meta .used { color: #5c6f7b; font-weight: 600; }

  .subrow {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px dashed #dde7ec;
    font-size: 11.5px; color: #7d8f9a;
  }
  .subrow b { color: #33475a; font-weight: 700; font-variant-numeric: tabular-nums; }

  .err {
    display: none; margin-top: 14px; padding: 8px 12px; border-radius: 10px;
    background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 11.5px;
  }
  .foot { margin-top: 14px; text-align: center; font-size: 10.5px; color: #a9b8c1; }

  /* ── 月额度池 ── */
  .month {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px dashed #dde7ec;
  }
  .month-head { display: flex; justify-content: space-between; align-items: baseline; }
  .month-title { font-size: 13px; font-weight: 700; color: #33475a; }
  .month-title em { font-style: normal; font-size: 10.5px; color: #94a3ad; font-weight: 500; margin-left: 4px; }
  .month-pct { font-size: 17px; font-weight: 800; color: #16283a; font-variant-numeric: tabular-nums; }
  .month-pct small { font-size: 10.5px; color: #8b9aa5; font-weight: 500; margin-left: 3px; }
  .month-track { position: relative; margin-top: 10px; height: 9px; border-radius: 999px;
    background: #e3ebef; overflow: hidden; box-shadow: inset 0 1px 2px rgba(20,50,70,.08); }
  .month-track .seg { position: absolute; top: 0; height: 100%;
    transition: width .8s cubic-bezier(.22,1,.36,1), left .8s cubic-bezier(.22,1,.36,1); }
  .seg-code { left: 0; background: linear-gradient(90deg, #60a5fa, #3b82f6);
    border-radius: 999px 0 0 999px; }
  .seg-kimi { background: linear-gradient(90deg, #b6c2cc, #94a5b3); }
  .month-legend { display: flex; gap: 14px; margin-top: 7px; font-size: 10.5px; color: #8b9aa5; }
  .month-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .month-legend .lc { background: #3b82f6; }
  .month-legend .lk { background: #9aa9b6; }
  .month-meta { display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 11.5px; color: #8b9aa5; }
  .month-meta b { color: #5c6f7b; font-weight: 600; font-variant-numeric: tabular-nums; }
  .m-notice {
    display: none; margin-top: 10px; padding: 7px 12px; border-radius: 10px;
    background: #fffbeb; border: 1px solid #fde68a; color: #b45309; font-size: 11.5px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="logo">K3</div>
      <div class="titles">
        <h1>K3 余量</h1>
        <p>实时读取本机 Kimi Coding 用量</p>
      </div>
      <div class="live" id="liveBadge"><span class="dot"></span>实时</div>
    </div>

    <div class="body">
      <div class="ring-wrap">
        <svg width="138" height="138" viewBox="0 0 138 138">
          <defs>
            <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2dd4bf"/>
              <stop offset="100%" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
          <circle cx="69" cy="69" r="58" fill="none" stroke="#e4ecef" stroke-width="11"/>
          <circle id="ring" cx="69" cy="69" r="58" fill="none" stroke="url(#rg)"
                  stroke-width="11" stroke-linecap="round"
                  stroke-dasharray="364.42" stroke-dashoffset="364.42"
                  style="transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1); filter: drop-shadow(0 2px 4px rgba(45,212,191,.4));"/>
        </svg>
        <div class="ring-center">
          <div class="pct"><span id="pctNum">--</span><small>%</small></div>
          <div class="sub">剩余</div>
        </div>
      </div>

      <div class="fields">
        <div class="field"><div class="k">周期</div><div class="v">1 周</div></div>
        <div class="field"><div class="k">重置</div><div class="v" id="resetAt">--</div></div>
        <div class="field"><div class="k">套餐</div><div class="v" id="plan">--</div></div>
      </div>
    </div>

    <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="updatedAt">正在读取…</span>
      <span class="used" id="usedPct">已用 --%</span>
    </div>

    <div class="subrow">
      <span>5小时窗口 已用 <b id="winUsed">--</b> · <span id="winReset">--</span> 重置</span>
      <span>并发上限 <b id="parallel">--</b></span>
    </div>

    <div class="month">
      <div class="month-head">
        <span class="month-title">月总额度<em>全功能共享池</em></span>
        <span class="month-pct"><b id="mUsedPct">--</b>%<small>已用</small></span>
      </div>
      <div class="month-track">
        <div class="seg seg-code" id="mCode" style="width:0%"></div>
        <div class="seg seg-kimi" id="mKimi" style="left:0%;width:0%"></div>
      </div>
      <div class="month-legend">
        <span><i class="lc"></i>Code <span id="mCodePct">--</span></span>
        <span><i class="lk"></i>Kimi <span id="mKimiPct">--</span></span>
      </div>
      <div class="month-meta">
        <span><b id="mReset">--</b> 后重置</span>
        <span>赠送额度剩 <b id="mGift">--</b></span>
      </div>
      <div class="m-notice" id="mNotice"></div>
    </div>

    <div class="err" id="errBox"></div>
    <div class="foot">数据源 api.kimi.com/coding + kimi.com 订阅 · 每 30 秒自动刷新</div>
  </div>

<script>
const C = 364.42; // 2πr, r=58

function fmtReset(iso) {
  if (!iso) return "--";
  const d = new Date(iso);
  if (isNaN(d)) return "--";
  return `${d.getMonth()+1}月${d.getDate()}日 ` +
         `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtHM(iso) {
  if (!iso) return "--";
  const d = new Date(iso);
  if (isNaN(d)) return "--";
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function planName(level) {
  if (!level) return "--";
  const map = { LEVEL_ADVANCED: "ADVANCED", LEVEL_BASIC: "BASIC",
                LEVEL_PRO: "PRO", LEVEL_FREE: "FREE", LEVEL_TEAM: "TEAM" };
  return map[level] || String(level).replace(/^LEVEL_/, "");
}
function fmtDate(iso) {
  if (!iso) return "--";
  const d = new Date(iso);
  if (isNaN(d)) return "--";
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function agoText(ts) {
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 8) return "刚刚更新";
  if (s < 60) return `${s} 秒前更新`;
  return `${Math.floor(s/60)} 分钟前更新`;
}

let lastFetched = 0;

async function refresh() {
  const errBox = document.getElementById("errBox");
  try {
    const r = await fetch("/api/usage", { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "无数据");

    const d = j.data;
    lastFetched = j.fetched_at;

    // 每周额度
    const limit = parseInt(d?.usage?.limit ?? 0, 10);
    const remaining = parseInt(d?.usage?.remaining ?? 0, 10);
    const pct = limit > 0 ? Math.round(remaining / limit * 100) : 0;
    const usedPct = 100 - pct;

    document.getElementById("pctNum").textContent = pct;
    document.getElementById("ring").style.strokeDashoffset = C * (1 - pct/100);
    document.getElementById("resetAt").textContent = fmtReset(d?.usage?.resetTime);
    document.getElementById("plan").textContent = planName(d?.user?.membership?.level);
    document.getElementById("barFill").style.width = usedPct + "%";
    document.getElementById("usedPct").textContent = `已用 ${usedPct}%`;

    // 5 小时频限窗口
    const win = Array.isArray(d?.limits) ? d.limits[0] : null;
    if (win && win.detail) {
      const wl = parseInt(win.detail.limit ?? 0, 10);
      const wu = parseInt(win.detail.used ?? 0, 10);
      document.getElementById("winUsed").textContent = `${wu}/${wl}`;
      document.getElementById("winReset").textContent = fmtHM(win.detail.resetTime);
    }
    document.getElementById("parallel").textContent = d?.parallel?.limit ?? "--";

    // 状态
    if (j.error) {
      errBox.style.display = "block";
      errBox.textContent = "刷新失败（显示的是缓存数据）：" + j.error;
    } else {
      errBox.style.display = "none";
    }
  } catch (e) {
    errBox.style.display = "block";
    errBox.textContent = "读取失败：" + e.message;
    document.getElementById("updatedAt").textContent = "连接失败";
  }
  refreshMonthly();
}

async function refreshMonthly() {
  const notice = document.getElementById("mNotice");
  try {
    const r = await fetch("/api/monthly", { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "无数据");

    const d = j.data;
    const used = Math.round((d.used_ratio ?? 0) * 1000) / 10;
    const code = Math.round((d.code_ratio ?? 0) * 1000) / 10;
    const kimi = Math.max(0, Math.round((used - code) * 10) / 10);

    document.getElementById("mUsedPct").textContent = used;
    document.getElementById("mCode").style.width = code + "%";
    const kimiSeg = document.getElementById("mKimi");
    kimiSeg.style.left = code + "%";
    kimiSeg.style.width = kimi + "%";
    document.getElementById("mCodePct").textContent = code + "%";
    document.getElementById("mKimiPct").textContent = kimi + "%";
    document.getElementById("mReset").textContent = fmtDate(d.reset_at);

    if (d.gift) {
      const left = Math.round((1 - (d.gift.used_ratio ?? 0)) * 100);
      document.getElementById("mGift").textContent = `${left}%（${fmtDate(d.gift.expire)}到期）`;
    } else {
      document.getElementById("mGift").textContent = "无";
    }

    if ((d.used_ratio ?? 0) >= 1 && d.notice) {
      notice.style.display = "block";
      notice.textContent = "月度池已用完，正在消耗赠送额度";
    } else {
      notice.style.display = "none";
    }
  } catch (e) {
    notice.style.display = "block";
    notice.textContent = "月额度读取失败：" + e.message;
  }
}

setInterval(() => {
  if (lastFetched) document.getElementById("updatedAt").textContent = agoText(lastFetched);
}, 1000);

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
